# deploy.yml : Pipeline CI/CD — build image Docker AMD64 et déploiement SSH sur VPS Scaleway
# Déclenché à chaque push sur main. Build via Docker Buildx (linux/amd64).
name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Droits du jeton intégré (GITHUB_TOKEN) : lecture du code seulement.
    permissions:
      contents: read

    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2. Configurer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # 3. Se connecter à GHCR (jeton personnel classic, portée write:packages, à renouveler
      # avant son expiration : secret GHCR_TOKEN)
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 4. Builder et pousser l'image AMD64
      # Deux tags poussés : latest (commodité) et SHA du commit (rollback immuable)
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/rookain-kiwi/kiwinet-web:latest
            ghcr.io/rookain-kiwi/kiwinet-web:${{ github.sha }}

      # 5. Déployer sur le VPS via SSH
      # La clé de déploiement est restreinte côté serveur à un seul script
      # (deploy-kiwinet-web : docker compose pull website, puis up -d website) :
      # le serveur ignore le contenu de « script », que l'action exige pourtant.
      # fingerprint : empreinte de la clé d'hôte du serveur (information publique),
      # à mettre à jour si le serveur change (migration).
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: SHA256:gV7Sh79/f+f9B2AKrIfYqSbsI0wtw+nlzMXJJE4IqsU
          script: deploy-kiwinet-web
